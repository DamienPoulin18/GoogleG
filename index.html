<!DOCTYPE html>
<html lang="fr">
<head>
    <script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/sw.js');
    });
  }
</script>
    <meta charset="UTF-8">
    <title>GoogleWs - Home</title>
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="shortcut icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />

    <!-- IMPORTATION DE LA POLICE FREDOKA DEPUIS GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: 'Fredoka', sans-serif; }
        #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('RedKing.png') center/cover; z-index: 5; }
        
        #view { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            background: #fff; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.2s ease;
        }
        iframe { width: 100%; height: 100%; border: none; }
        #sensor { position: fixed; top: 0; left: 0; width: 100%; height: 10px; z-index: 100; pointer-events: all; }

        /* --- STYLISATION DE L'ANNONCE TRANSPARENTE ORANGE --- */
        #global-announcement-banner {
            display: none;
            position: absolute;
            top: 25px; 
            left: 0;
            width: 100%;
            background-color: transparent;
            color: #ffaa00; 
            text-align: center;

            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 2.8rem; 
            letter-spacing: 1.5px;

            z-index: 10030; 
            text-shadow: none;
            box-sizing: border-box;
            pointer-events: none;
        }

        /* --- FENÊTRES DE CONFIGURATION ADMIN ET AUTHENTIFICATION --- */
        .admin-modal {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 10020;
            width: 400px;
            color: #000;
            font-family: 'Fredoka', sans-serif;
        }

        .admin-modal input[type="text"], 
        .admin-modal input[type="password"] {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 10px;
            font-family: 'Fredoka', sans-serif;
        }

        .admin-modal p {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
        }

        .checkbox-container {
            display: flex;
            align-items: center;
            margin-top: 12px;
            font-size: 0.95rem;
            color: #333;
            cursor: pointer;
        }

        .checkbox-container input {
            margin-right: 8px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .modal-btn {
            margin-top: 15px;
            width: 100%;
            padding: 10px;
            background: #ffaa00;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-family: 'Fredoka', sans-serif;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .modal-btn:hover {
            background: #e69900;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="sensor"></div>
    <div id="bg"></div>
    
    <div id="view">
        <iframe id="ifr" src="about:blank"></iframe>
    </div>

    <!-- La bannière d'annonce globale orange -->
    <div id="global-announcement-banner">
        <span id="announcement-text"></span>
    </div>

    <!-- Fenêtre 1 : Connexion Admin -->
    <div id="admin-auth-modal" class="admin-modal">
        <p><strong>Authentification Administrateur</strong></p>
        <input type="password" id="auth-code-input" placeholder="Code administrateur...">
        <input type="text" id="auth-username-input" placeholder="Nom d'utilisateur (ex: Rip_Motly)..." value="Rip_Motly">
        
        <label class="checkbox-container">
            <input type="checkbox" id="auth-save-checkbox">
            Se souvenir du code (Save)
        </label>
        
        <button id="auth-submit-btn" class="modal-btn">Valider</button>
        <p style="font-size: 0.8rem; color: #999; margin-top: 8px;">Appuyez sur Entrée pour valider, Échap pour fermer</p>
    </div>

    <!-- Fenêtre 2 : Création de l'annonce -->
    <div id="announcement-prompt" class="admin-modal">
        <p><strong id="prompt-title">Créer une annonce globale</strong></p>
        <input type="text" id="announcement-input" placeholder="Texte de l'annonce...">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px;">
            <p style="font-size: 0.8rem; color: #999;">Entrée pour diffuser, Échap pour fermer</p>
            <button id="logout-btn" style="background: none; border: none; color: #ffaa00; font-family: 'Fredoka', sans-serif; font-weight: bold; cursor: pointer; font-size: 0.85rem;">Mettre à jour le code</button>
        </div>
    </div>

    <!-- INTEGRATION DU SDK FIREBASE VIA CDN -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDjXH-T5x-HGzdRa23FccprypShYk3UPKM",
            authDomain: "w-af3ed.firebaseapp.com",
            databaseURL: "https://w-af3ed-default-rtdb.firebaseio.com",
            projectId: "w-af3ed",
            storageBucket: "w-af3ed.firebasestorage.app",
            messagingSenderId: "782718837615",
            appId: "1:782718837615:web:e7ebdd5773ce9152f4fe9a",
            measurementId: "G-DKYF6JZ7D2"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const announcementRef = ref(db, 'annonces/derniere_annonce');

        const _0x = (s) => s.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');
        const P_URL = _0x("iuuqt;00rvbtbs/vc/qivsj/dd"); 
        const C_URL = _0x("iuuqt;00dmbttsppn/hpphmf/dpn0v010i");
        const S_KEY = _0x("lbtqo");

        const ADMIN_CODE = "admin123"; 

        let input = "";
        let isActive = false;
        let announcementTimer = null; 
        let currentAdminUser = ""; 

        const authModal = document.getElementById('admin-auth-modal');
        const authCodeInput = document.getElementById('auth-code-input');
        const authUsernameInput = document.getElementById('auth-username-input');
        const authSaveCheckbox = document.getElementById('auth-save-checkbox');
        const authSubmitBtn = document.getElementById('auth-submit-btn');

        const promptBox = document.getElementById('announcement-prompt');
        const inputField = document.getElementById('announcement-input');
        const logoutBtn = document.getElementById('logout-btn');
        const banner = document.getElementById('global-announcement-banner');
        const bannerText = document.getElementById('announcement-text');
        const promptTitle = document.getElementById('prompt-title');

        // Vérification au chargement
        if (localStorage.getItem('admin_saved') === 'true') {
            authSaveCheckbox.checked = true;
            if (localStorage.getItem('admin_username')) {
                authUsernameInput.value = localStorage.getItem('admin_username');
            }
        }

        // Action sur la case à cocher pour supprimer directement les données enregistrées si décoche
        authSaveCheckbox.addEventListener('change', () => {
            if (!authSaveCheckbox.checked) {
                localStorage.removeItem('admin_saved');
                localStorage.removeItem('admin_username');
            }
        });

        // Bouton "Mettre à jour le code" pour décocher ou se déconnecter facilement
        logoutBtn.addEventListener('click', () => {
            promptBox.style.display = 'none';
            authModal.style.display = 'block';
            setTimeout(() => authCodeInput.focus(), 50);
        });

        onValue(announcementRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.text) {
                afficherAnnonce(data.text);
            }
        });

        function ouvrirPromptAnnonce(username) {
            currentAdminUser = username;
            promptTitle.textContent = `Annonce de : ${currentAdminUser}`;
            authModal.style.display = 'none';
            promptBox.style.display = 'block';
            setTimeout(() => inputField.focus(), 50);
        }

        function validerConnexionAdmin() {
            const codeEntre = authCodeInput.value.trim();
            const usernameEntre = authUsernameInput.value.trim() || "Rip_Motly";

            if (codeEntre === ADMIN_CODE) {
                if (authSaveCheckbox.checked) {
                    localStorage.setItem('admin_saved', 'true');
                    localStorage.setItem('admin_username', usernameEntre);
                } else {
                    localStorage.removeItem('admin_saved');
                    localStorage.removeItem('admin_username');
                }
                authCodeInput.value = '';
                ouvrirPromptAnnonce(usernameEntre);
            } else {
                alert("Code administrateur incorrect !");
                authCodeInput.value = '';
            }
        }

        authSubmitBtn.addEventListener('click', validerConnexionAdmin);

        authCodeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') validerConnexionAdmin();
        });

        authUsernameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') validerConnexionAdmin();
        });

        // --- GESTIONNAIRE DES TOUCHES CLAVIER ---
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();

            if (e.key === 'Escape') {
                promptBox.style.display = 'none';
                authModal.style.display = 'none';
                inputField.value = '';
                authCodeInput.value = '';
                return;
            }

            if (document.activeElement === inputField || 
                document.activeElement === authCodeInput || 
                document.activeElement === authUsernameInput) return;

            if (k === 'q') {
                window.location.replace(C_URL);
                return;
            }

            if (e.key.length === 1) {
                input += k;
            }

            if (input.endsWith(S_KEY)) {
                window.history.pushState({state:1}, "", "/drive/u/0/my-drive");
                launch();
                input = "";
            }
            
            if (input.length > 5) {
                input = input.slice(-5);
            }

            // Touche G pour ouvrir
            if (k === 'g') {
                e.preventDefault(); 
                
                // Si Shift + G est appuyé, on réouvre le menu avec le mot de passe pour pouvoir décocher la case
                if (e.shiftKey) {
                    authModal.style.display = 'block';
                    setTimeout(() => authCodeInput.focus(), 50);
                    return;
                }

                if (localStorage.getItem('admin_saved') === 'true') {
                    const savedUser = localStorage.getItem('admin_username') || "Rip_Motly";
                    ouvrirPromptAnnonce(savedUser);
                } else {
                    authModal.style.display = 'block';
                    setTimeout(() => authCodeInput.focus(), 50);
                }
            }
        }, true);

        // --- ENVOI DE L'ANNONCE VERS FIREBASE ---
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const message = inputField.value.trim();
                if (message !== '' && currentAdminUser !== '') {
                    const texteComplet = `${currentAdminUser} : ${message}`;
                    
                    set(announcementRef, {
                        text: texteComplet,
                        timestamp: Date.now()
                    }).catch((err) => {
                        alert("Erreur réseau Firebase : " + err.message);
                    });
                    
                    promptBox.style.display = 'none';
                    inputField.value = '';

                    if (localStorage.getItem('admin_saved') !== 'true') {
                        currentAdminUser = "";
                    }
                }
            }
        });

        function afficherAnnonce(texte) {
            if (announcementTimer) {
                clearTimeout(announcementTimer);
            }

            bannerText.textContent = texte;
            banner.style.display = 'block';

            announcementTimer = setTimeout(() => {
                banner.style.display = 'none';
                bannerText.textContent = '';
            }, 5000);
        }

        function launch() {
            const v = document.getElementById('view');
            const f = document.getElementById('ifr');
            
            if (f.src === "about:blank" || f.src === window.location.href) {
                f.src = P_URL;
            }
            
            document.getElementById('bg').style.display = 'none';
            v.style.opacity = '1';
            v.style.pointerEvents = 'auto'; 
            document.title = "Google Docs";
            isActive = true;
        }
    </script>

</body>
</html>
