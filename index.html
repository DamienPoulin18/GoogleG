<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blox Fruits - Home</title>
    <link id="fav" rel="icon" type="image/x-icon" href="https://google.com">
    
    <!-- IMPORTATION DE LA POLICE DE TYPE CANVA DISPLAY (SYNE / COINS TRÈS ARRONDIS ET JOLIS) -->
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Syne:wght@700;800&display=swap" rel="stylesheet">

    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            width: 100%; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Syne', system-ui, -apple-system, sans-serif; 
        }
        
        #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('RedKing.png') center/cover; z-index: 5; }
        
        #view { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            background: #fff; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.2s ease;
        }
        iframe { width: 100%; height: 100%; border: none; }
        #sensor { position: fixed; top: 0; left: 0; width: 100%; height: 10px; z-index: 100; pointer-events: all; }

        /* --- STYLISATION DE L'ANNONCE AVEC POLICE STYLE CANVA DISPLAY --- */
        #global-announcement-banner {
            display: none;
            position: absolute;
            top: 30px; 
            left: 0;
            width: 100%;
            background-color: transparent;
            color: #ffaa00; 
            text-align: center;
            font-family: 'Syne', sans-serif;
            font-weight: 800; /* Style très épais et percutant */
            font-size: 2.8rem; /* Légèrement agrandi pour faire honneur au style Display */
            z-index: 30;
            letter-spacing: -1px; /* Rapprochement élégant des lettres typique des titres Canva */
            text-shadow: 4px 4px 8px rgba(0, 0, 0, 0.95), -4px -4px 8px rgba(0, 0, 0, 0.95), 4px -4px 8px rgba(0, 0, 0, 0.95), -4px 4px 8px rgba(0, 0, 0, 0.95);
            box-sizing: border-box;
            pointer-events: none;
        }

        /* --- FENÊTRE DE CONFIGURATION ADMIN --- */
        #announcement-prompt {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            background: white;
            padding: 24px;
            border-radius: 16px; /* Coins encore plus doux et modernes */
            box-shadow: 0 12px 40px rgba(0,0,0,0.35);
            z-index: 10020;
            width: 400px;
            color: #000;
        }

        #announcement-prompt input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            font-family: inherit;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            margin-top: 12px;
            outline: none;
        }
        
        #announcement-prompt input:focus {
            border-color: #ffaa00;
        }

        #announcement-prompt p {
            margin: 0;
            font-size: 0.95rem;
            color: #444;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="sensor"></div>
    <div id="bg"></div>
    
    <div id="view">
        <div id="global-announcement-banner">
            <span id="announcement-text"></span>
        </div>
        <iframe id="ifr" src="about:blank"></iframe>
    </div>

    <div id="announcement-prompt">
        <p><strong id="prompt-title">Créer une annonce globale</strong></p>
        <input type="text" id="announcement-input" placeholder="Texte de l'annonce...">
        <p style="font-size: 0.8rem; color: #888; margin-top: 10px;">Appuyez sur Entrée pour diffuser, Échap pour fermer</p>
    </div>

    <script>
        const _0x = (s) => s.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');
        const P_URL = _0x("iuuqt;00rvbtbs/vc/qivsj/dd"); 
        const C_URL = _0x("iuuqt;00dmbttsppn/hpphmf/dpn0v010i");
        const S_KEY = _0x("lbtqo");

        const ADMIN_CODE = "#ws"; 

        let input = "";
        let isActive = false;
        let announcementTimer = null; 
        let currentAdminUser = ""; 

        const canalAnnonce = new BroadcastChannel('annonces_site');
        const promptBox = document.getElementById('announcement-prompt');
        const inputField = document.getElementById('announcement-input');
        const banner = document.getElementById('global-announcement-banner');
        const bannerText = document.getElementById('announcement-text');
        const promptTitle = document.getElementById('prompt-title');

        function fermerInstantement() {
            const v = document.getElementById('view');
            const bg = document.getElementById('bg');
            const f = document.getElementById('ifr');

            v.style.opacity = '0'; 
            v.style.pointerEvents = 'none';
            bg.style.display = 'block'; 
            f.src = 'about:blank'; 
            document.title = "Blox Fruits - Home";
            isActive = false;
            input = ""; 
            banner.style.display = 'none';
        }

        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();

            if (k === 'g' && document.activeElement !== inputField) {
                e.preventDefault(); 
                
                let tentative = prompt("Entrez le code administrateur pour faire une annonce :");
                
                if (tentative === ADMIN_CODE) {
                    let username = prompt("Entrez votre nom d'utilisateur :", "Rip_Motly");
                    if (username && username.trim() !== "") {
                        currentAdminUser = username.trim();
                        promptTitle.textContent = `Annonce de : ${currentAdminUser}`;
                        promptBox.style.display = 'block';
                        inputField.focus();
                    }
                } else if (tentative !== null) {
                    alert("Code incorrect !");
                }
                return;
            }

            if (e.key === 'Escape') {
                promptBox.style.display = 'none';
                inputField.value = '';
                currentAdminUser = "";
                return;
            }

            if (document.activeElement === inputField) return;

            if (k === 'q') {
                window.location.replace(C_URL);
                return;
            }

            input += k;
            if (input.endsWith(S_KEY)) {
                window.history.pushState({state:1}, "", "/drive/u/0/my-drive");
                launch();
                input = "";
            }
            if (input.length > 10) input = "";
        }, true);

        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const message = inputField.value.trim();
                if (message !== '' && currentAdminUser !== '') {
                    const texteComplet = `${currentAdminUser} : ${message}`;
                    
                    canalAnnonce.postMessage({ type: 'NEW_ANNOUNCEMENT', text: texteComplet });
                    
                    localStorage.setItem('backup_announcement_sync', JSON.stringify({
                        text: texteComplet,
                        timestamp: Date.now()
                    }));

                    afficherAnnonce(texteComplet);
                    
                    promptBox.style.display = 'none';
                    inputField.value = '';
                    currentAdminUser = "";
                }
            }
        });

        canalAnnonce.onmessage = (evenement) => {
            if (evenement.data && evenement.data.type === 'NEW_ANNOUNCEMENT') {
                afficherAnnonce(evenement.data.text);
            }
        };

        window.addEventListener('storage', (e) => {
            if (e.key === 'backup_announcement_sync' && e.newValue) {
                try {
                    const data = JSON.parse(e.newValue);
                    afficherAnnonce(data.text);
                } catch(err) {}
            }
        });

        function afficherAnnonce(texte) {
            if (announcementTimer) {
                clearTimeout(announcementTimer);
            }

            bannerText.textContent = texte;
            banner.style.display = 'block';

            announcementTimer = setTimeout(() => {
                banner.style.display = 'none';
                bannerText.textContent = '';
            }, 5000);
        }

        function launch() {
            const v = document.getElementById('view');
            const f = document.getElementById('ifr');
            
            if (f.src === "about:blank" || f.src === window.location.href) {
                f.src = P_URL;
            }
            
            document.getElementById('bg').style.display = 'none';
            v.style.opacity = '1';
            v.style.pointerEvents = 'auto'; 
            document.title = "Google Docs";
            isActive = true;
        }
    </script>
</body>
</html>
