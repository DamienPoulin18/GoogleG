<!DOCTYPE html>
<html lang="fr">
<head>

    <meta charset="UTF-8">
    <title>GoogleWs - Home</title>
    <link rel="icon" type="image/png" href="./favicon-96x96.png" sizes="96x96" />

    <!-- IMPORTATION DE LA POLICE FREDOKA DEPUIS GOOGLE FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&display=swap" rel="stylesheet">

    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: 'Fredoka', sans-serif; }
        #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('RedKing.png') center/cover; z-index: 5; }
        
        #view { 
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: 10; 
            background: #fff; 
            opacity: 0; 
            pointer-events: none; 
            transition: opacity 0.2s ease;
        }
        iframe { width: 100%; height: 100%; border: none; }
        #sensor { position: fixed; top: 0; left: 0; width: 100%; height: 10px; z-index: 100; pointer-events: all; }

        /* --- STYLISATION DE L'ANNONCE TRANSPARENTE ORANGE --- */
        #global-announcement-banner {
            display: none;
            position: absolute;
            top: 25px; 
            left: 0;
            width: 100%;
            background-color: transparent;
            color: #ffaa00; 
            text-align: center;

            /* POLICE FREDOKA SANS CONTOUR NOIR */
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            font-size: 2.8rem; 
            letter-spacing: 1.5px;

            z-index: 10030; 
            text-shadow: none; /* Contour noir supprimé */
            box-sizing: border-box;
            pointer-events: none;
        }

        /* --- FENÊTRE DE CONFIGURATION ADMIN --- */
        #announcement-prompt {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
            z-index: 10020;
            width: 400px;
            color: #000;
            font-family: 'Fredoka', sans-serif;
        }

        #announcement-prompt input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 2px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            margin-top: 10px;
            font-family: 'Fredoka', sans-serif;
        }

        #announcement-prompt p {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="sensor"></div>
    <div id="bg"></div>
    
    <div id="view">
        <iframe id="ifr" src="about:blank"></iframe>
    </div>

    <!-- La bannière d'annonce globale orange -->
    <div id="global-announcement-banner">
        <span id="announcement-text"></span>
    </div>

    <div id="announcement-prompt">
        <p><strong id="prompt-title">Créer une annonce globale</strong></p>
        <input type="text" id="announcement-input" placeholder="Texte de l'annonce...">
        <p style="font-size: 0.8rem; color: #999; margin-top: 8px;">Appuyez sur Entrée pour diffuser, Échap pour fermer</p>
    </div>

    <!-- INTEGRATION DU SDK FIREBASE VIA CDN -->
    <script type="module">
        // 1. Importation du SDK Firebase
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // 2. Configuration Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyDjXH-T5x-HGzdRa23FccprypShYk3UPKM",
            authDomain: "w-af3ed.firebaseapp.com",
            databaseURL: "https://w-af3ed-default-rtdb.firebaseio.com",
            projectId: "w-af3ed",
            storageBucket: "w-af3ed.firebasestorage.app",
            messagingSenderId: "782718837615",
            appId: "1:782718837615:web:e7ebdd5773ce9152f4fe9a",
            measurementId: "G-DKYF6JZ7D2"
        };

        // 3. Initialisation de Firebase & Realtime Database
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const announcementRef = ref(db, 'annonces/derniere_annonce');

        const _0x = (s) => s.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');
        const P_URL = _0x("iuuqt;00rvbtbs/vc/qivsj/dd"); 
        const C_URL = _0x("iuuqt;00dmbttsppn/hpphmf/dpn0v010i");
        const S_KEY = _0x("lbtqo");

        const ADMIN_CODE = "adminkaspn"; 

        let input = "";
        let isActive = false;
        let announcementTimer = null; 
        let currentAdminUser = ""; 

        const promptBox = document.getElementById('announcement-prompt');
        const inputField = document.getElementById('announcement-input');
        const banner = document.getElementById('global-announcement-banner');
        const bannerText = document.getElementById('announcement-text');
        const promptTitle = document.getElementById('prompt-title');

        // Écoute en temps réel des messages dans Firebase
        onValue(announcementRef, (snapshot) => {
            const data = snapshot.val();
            if (data && data.text) {
                afficherAnnonce(data.text);
            }
        });

        function fermerInstantement() {
            const v = document.getElementById('view');
            const bg = document.getElementById('bg');
            const f = document.getElementById('ifr');

            v.style.opacity = '0'; 
            v.style.pointerEvents = 'none';
            bg.style.display = 'block'; 
            f.src = 'about:blank'; 
            document.title = "Blox Fruits - Home";
            isActive = false;
            input = ""; 
            banner.style.display = 'none';
        }

        // --- GESTIONNAIRE DES TOUCHES CLAVIER ---
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();

            if (e.key === 'Escape') {
                promptBox.style.display = 'none';
                inputField.value = '';
                currentAdminUser = "";
                return;
            }

            if (document.activeElement === inputField) return;

            if (k === 'q') {
                window.location.replace(C_URL);
                return;
            }

            if (e.key.length === 1) {
                input += k;
            }

            if (input.endsWith(S_KEY)) {
                window.history.pushState({state:1}, "", "/drive/u/0/my-drive");
                launch();
                input = "";
            }
            
            if (input.length > 5) {
                input = input.slice(-5);
            }

            if (k === 'g') {
                e.preventDefault(); 
                
                let tentative = prompt("Entrez le code administrateur pour faire une annonce :");
                
                if (tentative === ADMIN_CODE) {
                    let username = prompt("Entrez votre nom d'utilisateur :", "Rip_Motly");
                    if (username && username.trim() !== "") {
                        currentAdminUser = username.trim();
                        promptTitle.textContent = `Annonce de : ${currentAdminUser}`;
                        promptBox.style.display = 'block';
                        setTimeout(() => inputField.focus(), 50);
                    }
                } else if (tentative !== null) {
                    alert("Code incorrect !");
                }
            }
        }, true);

        // --- ENVOI DE L'ANNONCE VERS FIREBASE ---
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const message = inputField.value.trim();
                if (message !== '' && currentAdminUser !== '') {
                    const texteComplet = `${currentAdminUser} : ${message}`;
                    
                    // Envoi vers la base de données
                    set(announcementRef, {
                        text: texteComplet,
                        timestamp: Date.now()
                    }).catch((err) => {
                        alert("Erreur réseau Firebase : " + err.message);
                    });
                    
                    promptBox.style.display = 'none';
                    inputField.value = '';
                    currentAdminUser = "";
                }
            }
        });

        // --- FONCTION D'AFFICHAGE DE LA BANNIÈRE (5 SECONDES) ---
        function afficherAnnonce(texte) {
            if (announcementTimer) {
                clearTimeout(announcementTimer);
            }

            bannerText.textContent = texte;
            banner.style.display = 'block';

            announcementTimer = setTimeout(() => {
                banner.style.display = 'none';
                bannerText.textContent = '';
            }, 5000);
        }

        function launch() {
            const v = document.getElementById('view');
            const f = document.getElementById('ifr');
            
            if (f.src === "about:blank" || f.src === window.location.href) {
                f.src = P_URL;
            }
            
            document.getElementById('bg').style.display = 'none';
            v.style.opacity = '1';
            v.style.pointerEvents = 'auto'; 
            document.title = "Google Docs";
            isActive = true;
        }
    </script>

</body>
</html>
