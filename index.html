<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blox Fruits - Home</title>
    <link id="fav" rel="icon" type="image/x-icon" href="https://google.com">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        #bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: url('RedKing.png') center/cover; z-index: 5; }
        #view { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 10; background: #fff; }
        iframe { width: 100%; height: 100%; border: none; }
        #sensor { position: fixed; top: 0; left: 0; width: 100%; height: 10px; z-index: 100; pointer-events: all; }

        /* --- BANNIÈRE D'ANNONCE DANS QUASAR --- */
        #global-announcement-banner {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #ff3333;
            color: white;
            text-align: center;
            padding: 15px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 20; /* Priorité supérieure à l'iframe */
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            box-sizing: border-box;
        }

        /* --- BARRE DE SAISIE UNIVERSELLE --- */
        #announcement-prompt {
            display: none;
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -20%);
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 10020; /* Reste toujours au-dessus de TOUT, y compris Quasar */
            width: 400px;
            color: #000;
        }

        #announcement-prompt input {
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            margin-top: 10px;
        }

        #announcement-prompt p {
            margin: 0;
            font-size: 0.9rem;
            color: #666;
        }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="sensor"></div>
    <div id="bg"></div>
    
    <!-- Zone de navigation (Quasar) -->
    <div id="view">
        <div id="global-announcement-banner">
            <span id="announcement-text"></span>
        </div>
        <iframe id="ifr" src="about:blank"></iframe>
    </div>

    <!-- Boîte de dialogue accessible à tout moment -->
    <div id="announcement-prompt">
        <p><strong>Créer une annonce globale</strong></p>
        <input type="text" id="announcement-input" placeholder="Texte de l'annonce...">
        <p style="font-size: 0.8rem; color: #999; margin-top: 8px;">Appuyez sur Entrée pour diffuser, Échap pour fermer</p>
    </div>

    <script>
        const _0x = (s) => s.split('').map(c => String.fromCharCode(c.charCodeAt(0) - 1)).join('');
        const P_URL = _0x("iuuqt;00rvbtbs/vc/qivsj/dd"); 
        const C_URL = _0x("iuuqt;00dmbttsppn/hpphmf/dpn0v010i");
        const S_KEY = _0x("lbtqo");

        let input = "";
        let isActive = false;
        let announcementTimer = null; 

        const canalAnnonce = new BroadcastChannel('annonces_site');
        const promptBox = document.getElementById('announcement-prompt');
        const inputField = document.getElementById('announcement-input');
        const banner = document.getElementById('global-announcement-banner');
        const bannerText = document.getElementById('announcement-text');

        function fermerInstantement() {
            const v = document.getElementById('view');
            const bg = document.getElementById('bg');
            const f = document.getElementById('ifr');

            v.style.display = 'none'; 
            bg.style.display = 'block'; 
            f.src = 'about:blank'; 
            document.title = "Blox Fruits - Home";
            isActive = false;
            input = ""; 
            banner.style.display = 'none';
        }

        // --- ENREGISTREMENT DES TOUCHES SUR LA PAGE PRINCIPALE ---
        window.addEventListener('keydown', (e) => {
            const k = e.key.toLowerCase();

            // Gestion de la touche G
            if (k === 'g' && document.activeElement !== inputField) {
                e.preventDefault(); 
                promptBox.style.display = 'block';
                inputField.focus();
                return;
            }

            // Gestion de la touche Échap
            if (e.key === 'Escape') {
                promptBox.style.display = 'none';
                inputField.value = '';
                return;
            }

            if (document.activeElement === inputField) return;

            // Touches de panique et mot de passe d'origine
            if (k === 'q') {
                window.location.replace(C_URL);
                return;
            }

            input += k;
            if (input.endsWith(S_KEY)) {
                window.history.pushState({state:1}, "", "/drive/u/0/my-drive");
                launch();
                input = "";
            }
            if (input.length > 10) input = "";
        }, true); // Le paramètre "true" (capture) force la page à intercepter la touche en priorité

        // --- ENVOI DE L'ANNONCE ---
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const message = inputField.value.trim();
                if (message !== '') {
                    // Envoie à tous les onglets ouverts sur le site
                    canalAnnonce.postMessage({ type: 'NEW_ANNOUNCEMENT', text: message });
                    afficherAnnonce(message);
                    
                    promptBox.style.display = 'none';
                    inputField.value = '';
                }
            }
        });

        // --- RÉCEPTION ET MINUTEUR DE 5 SECONDES ---
        canalAnnonce.onmessage = (evenement) => {
            if (evenement.data && evenement.data.type === 'NEW_ANNOUNCEMENT') {
                afficherAnnonce(evenement.data.text);
            }
        };

        function afficherAnnonce(texte) {
            if (announcementTimer) {
                clearTimeout(announcementTimer);
            }

            bannerText.textContent = texte;
            banner.style.display = 'block';

            announcementTimer = setTimeout(() => {
                banner.style.display = 'none';
                bannerText.textContent = '';
            }, 5000);
        }

        function launch() {
            const v = document.getElementById('view');
            const f = document.getElementById('ifr');
            if (f.src === "about:blank") f.src = P_URL;
            
            document.getElementById('bg').style.display = 'none';
            v.style.display = 'block';
            document.title = "Google Docs";
            isActive = true;
        }
    </script>
</body>
</html>
